<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charts and labels</title>
<!-- audit.mjs --kind app, "chart(s) with no text" (lib/inventory.mjs charts filter; stage-2 S5 G4). Five SVG/canvas
     graphics with data-like shapes; only #bare is an unlabelled chart:
       #named-by   role="img" aria-labelledby → a heading with text: labelled
       #pattern    aria-hidden="true": decoration, not a chart
       #titled     role="img" title="…": an accessible name
       #canvas     canvas role="img" aria-labelledby → text: labelled
       #bare       paths and nothing else: reported -->
<style>
  body { margin: 24px; font: 14px/1.5 sans-serif; color: #16181d; }
  main { display: grid; gap: 16px; max-width: 640px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 16px; margin: 0; }
  svg, canvas { display: block; }
</style>
</head>
<body>
<main>
  <h1>Weekly orders</h1>
  <section><h2 id="orders-h">Orders per day, last week: 12, 18, 9, 22, 30</h2>
    <svg id="named-by" role="img" aria-labelledby="orders-h" width="300" height="80" viewBox="0 0 300 80"><path d="M0 60 L60 40 L120 70 L180 30 L240 10" fill="none" stroke="#0b5cad" stroke-width="2"/></svg></section>
  <section><svg id="pattern" aria-hidden="true" width="300" height="40" viewBox="0 0 300 40"><rect x="0" y="0" width="300" height="40" fill="#eef0f6"/><circle cx="20" cy="20" r="6" fill="#c8ccd6"/></svg></section>
  <section><svg id="titled" role="img" title="Returns per day: 1, 0, 2, 1, 0" width="300" height="80" viewBox="0 0 300 80"><rect x="10" y="40" width="30" height="40" fill="#0b5cad"/><rect x="60" y="60" width="30" height="20" fill="#0b5cad"/></svg></section>
  <section><h2 id="rev-h">Revenue per day: £1,200, £900, £1,450</h2><canvas id="canvas" role="img" aria-labelledby="rev-h" width="300" height="80"></canvas></section>
  <section><svg id="bare" width="300" height="80" viewBox="0 0 300 80"><polyline points="0,70 60,50 120,60 180,20 240,30" fill="none" stroke="#0b5cad" stroke-width="2"/></svg></section>
</main>
</body>
</html>
