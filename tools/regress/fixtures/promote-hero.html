<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>hero-effect.js fixture</title>
<!-- A generative hero through templates/code/hero-effect.js (with governor.js and tier.js), for tools/regress.mjs.
     Fixture-only query flags: ?slow=MS (busy-wait MS per frame: an effect that fewer pixels cannot speed up),
     ?fail (init throws), ?gl1 (WebGL1: no fence), ?settle=N, ?fps=N. The page records how the fence was read. -->
<style>
  body { margin: 0; font: 17px/1.5 system-ui, sans-serif; background: #f6f4ef; color: #13202b; }
  .hero { position: relative; min-height: 100vh; display: grid; align-items: end; color: #fff; overflow: hidden; background: #09122a; isolation: isolate; }
  .hero-bg { position: absolute; inset: 0; z-index: -1; }
  .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .fx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity .6s ease-out; }
  .bg-toggle { position: absolute; right: 24px; bottom: 24px; z-index: 2; background: rgba(9,18,42,.6); color: #fff; border: 1px solid rgba(255,255,255,.5); border-radius: 999px; padding: 8px 14px; font: 500 13px system-ui, sans-serif; }
  .copy { padding: 0 32px 12vh; max-width: 40rem; }
  main { padding: 64px 32px; min-height: 300vh; }
  @media (prefers-reduced-motion: reduce) { .fx { transition: none; } }
</style>
</head><body>
<section class="hero" aria-labelledby="h1">
  <div class="hero-bg" aria-hidden="true"><img class="poster" alt="" fetchpriority="high" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 9'%3E%3Cdefs%3E%3ClinearGradient id='g' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2309122a'/%3E%3Cstop offset='1' stop-color='%230a3440'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='16' height='9' fill='url(%23g)'/%3E%3C/svg%3E"></div>
  <button class="bg-toggle" type="button" hidden>Pause background animation</button>
  <div class="copy"><h1 id="h1">Every drop, accounted for.</h1><p>Readings from probes in the river, every ten minutes.</p></div>
</section>
<main><h2>Below the hero</h2><p>Scrolled past, the effect must stop asking for frames.</p></main>
<script type="module">
const q = new URLSearchParams(location.search);
const bg = document.querySelector('.hero-bg'), btn = document.querySelector('.bg-toggle');
const T = window.__t = { frames: 0, fence: { calls: 0, signaledAtLast: null }, imported: false, err: null };
// A self-authored full-screen shader (no borrowed code): two drifting sine fields.
const VERT = 'attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }';
const FRAG = 'precision mediump float; uniform float t; uniform vec2 r; void main() { vec2 u = gl_FragCoord.xy / r; float v = 0.5 + 0.25 * sin(u.x * 6.0 + t) + 0.25 * sin(u.y * 5.0 - t * 0.7); gl_FragColor = vec4(0.04 + 0.1 * v, 0.07 + 0.2 * v, 0.16 + 0.25 * v, 1.0); }';
const slow = Number(q.get('slow') || 0);
let gl, uT, uR;
const effect = {
  kind: 'webgl',
  init(canvas) {
    if (q.has('fail')) throw new Error('fixture: init failed on purpose');
    const o = { antialias: false, depth: false, stencil: false, alpha: false, powerPreference: 'low-power' };
    gl = (!q.has('gl1') && canvas.getContext('webgl2', o)) || canvas.getContext('webgl', o);
    if (!gl) throw new Error('no WebGL');
    window.__gl = gl;
    if (gl.getSyncParameter) { const orig = gl.getSyncParameter.bind(gl); gl.getSyncParameter = (s, p) => { const v = orig(s, p); T.fence.calls++; T.fence.signaledAtLast = v === gl.SIGNALED; return v; }; }
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS) && !gl.isContextLost()) throw new Error(gl.getShaderInfoLog(s)); return s; };
    const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VERT)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FRAG)); gl.linkProgram(pr); gl.useProgram(pr);
    const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    uT = gl.getUniformLocation(pr, 't'); uR = gl.getUniformLocation(pr, 'r');
    return { gl };
  },
  resize(w, h) { gl.viewport(0, 0, w, h); gl.uniform2f(uR, w, h); },
  frame(t) { T.frames++; if (slow) { const until = performance.now() + slow; while (performance.now() < until); } gl.uniform1f(uT, t); gl.drawArrays(gl.TRIANGLES, 0, 3); },
  dispose() {},
};
const start = (optIn) => import('../../../skills/website-redesign/templates/code/hero-effect.js')
  .then((h) => { T.imported = true; return h.run(bg, effect, { toggle: btn, optIn, settle: Number(q.get('settle') || 0), fps: Number(q.get('fps') || 0), onFallback: (w) => { T.fallback = w; } }); })
  .then((c) => { window.__hero = c; })
  .catch((e) => { T.err = String(e); btn.hidden = true; });
if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
  btn.hidden = false; btn.textContent = 'Play background animation';
  btn.addEventListener('click', () => start(true), { once: true });
} else if (document.readyState === 'complete') start(false);
else addEventListener('load', () => start(false), { once: true });
</script>
</body></html>
