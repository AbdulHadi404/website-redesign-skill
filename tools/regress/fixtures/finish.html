<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Finish checks</title>
<style>
body{font:18px/1.5 system-ui,sans-serif;margin:0;color:#111;background:#fff}
main{padding:40px}
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;padding:40px;background:#123;color:#fff}
.hero p{margin:0}
.mono{font-family:monospace;font-size:36px;width:14ch}
.balanced{text-wrap:balance}
.card{background:#eef;border-radius:24px;padding:8px;width:320px;margin:0 0 24px}
.card a{display:block;background:#224;color:#fff;padding:14px 18px;text-decoration:none}
.swollen{border-radius:24px}
.concentric{border-radius:16px}
.icons a{display:inline-block;width:16px;height:16px;margin-right:4px;background:#224;vertical-align:middle}
.photo{height:600px;background:#ccc url(dashboard.png) center/cover}
</style></head>
<body>
<div class="hero"><h1 class="mono">Every cow is counted before milking</h1><p>Scroll</p></div>
<main>
<h2 class="mono balanced">Every cow is counted before milking</h2>
<div class="card"><a class="swollen" href="#a">24px inside 24px, 8px in</a></div>
<div class="card"><a class="concentric" href="#b">16px inside 24px, 8px in</a></div>
<div class="photo" role="img" aria-label="Dashboard screenshot"></div>
<p>Share: <span class="icons"><a href="#x" aria-label="X"></a><a href="#y" aria-label="LinkedIn"></a><a href="#z" aria-label="Email"></a></span></p>
<p>End.</p>
</main>
</body></html>
