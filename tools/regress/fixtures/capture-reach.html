<!doctype html>
<!-- capture.mjs regress fixture (run at 1024): left-to-right, no page-level clip. The nowrap line runs out of its own
     200px box, which sits at the end (right) side, and past the right edge of the viewport. The page scrolls sideways
     to it, so it is reported as horizontal overflow naming div.box, never as text past the viewport. The list item's
     negative text-indent pulls its first line past the left edge, the start edge, where nothing scrolls: expect
     "⚠ text past the viewport where no scroll reaches it" naming ul.hang > li with "px left". -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reachable and cut</title>
<style>
body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#111;background:#fff}
main{padding:8px}
.box{width:200px;margin-inline-start:auto;white-space:nowrap;border:1px solid #555}
.hang{list-style:none;margin:0;padding:0}
.hang li{text-indent:-40px}
</style></head>
<body><main>
<h1>Reachable and cut</h1>
<div class="box">Opening hours this week: Monday to Saturday from nine until six, Sunday closed</div>
<ul class="hang"><li>— Orders placed before noon leave the same day, and the rest leave the next morning.</li></ul>
</main></body></html>
