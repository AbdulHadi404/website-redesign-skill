<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overflowing form</title>
<!-- states.mjs regression fixture: a 900 px block widens the phone layout to 940 px; Playwright's pointer check then misses the consent box that nothing covers, while a touch tap reaches it. -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px sans-serif; background: #f4f6fb; }
  .top { background: #2563eb; color: #fff; padding: 14px 32px; }
  .wrap { max-width: 900px; margin: 40px auto; background: #fff; padding: 40px; }
  .row { display: flex; gap: 16px; } .row > * { flex: 1; }
  input, select { width: 100%; padding: 12px 14px; margin: 8px 0 16px; font: inherit; }
  .wide { width: 900px; height: 300px; background: #eef; }
</style></head>
<body>
<div class="top">Harbourside</div>
<div class="wrap">
  <h1>Resident parking permit</h1>
  <form>
    <div class="row"><input name="full_name" placeholder="Full name"><input name="email" placeholder="Email"></div>
    <div class="wide">A 900 px wide zone table</div>
    <div style="height:900px">More fields</div>
    <select name="permit_length"><option value="">Duration</option><option value="6">6 months</option></select>
    <label><input type="checkbox" name="consent" style="width:auto"> I agree to the terms</label>
    <button type="submit">Submit</button>
  </form>
</div>
</body></html>
