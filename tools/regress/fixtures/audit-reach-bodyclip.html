<!doctype html>
<!--
  Regression fixture for audit.mjs (tools/regress.mjs, group "audit"), run at 390 and 1024: overflow-x: hidden on
  body alone. html's overflow is visible, so body's moves to the viewport: the nowrap line that runs out of its own
  200px box still grows scrollWidth, but nothing scrolls sideways to it.
  At 390 a phone widens its layout viewport and shows the whole line zoomed out: expect "Phone layout viewport
  widened" and "Horizontal overflow" naming div.box, and no "Text past the viewport" (the reader sees the text, small).
  At 1024: expect "Horizontal overflow" naming div.box and "✗ Text past the viewport, where no scroll reaches it
  (overflow-x on html or body stops the page scrolling sideways)" naming div.box; never "scrollWidth did not grow".
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery</title>
<style>
  body { overflow-x: hidden; margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  header, footer { padding: 12px 16px; }
  main { padding: 16px; }
  .box { width: 200px; margin-inline-start: auto; white-space: nowrap; border: 1px solid #555; }
</style>
</head>
<body>
<header>Harbour shop</header>
<main>
  <h1>Delivery</h1>
  <div class="box">Free delivery on every order over forty euros this week, and on every order over twenty euros for members</div>
</main>
<footer>Harbour shop, Quay Street</footer>
</body>
</html>
