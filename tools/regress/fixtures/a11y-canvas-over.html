<!doctype html>
<html lang="en">
<!-- For tools/regress.mjs (a11y.mjs, clickable canvases): controls over a canvas that takes no focus. The page's own
     controls over a mouse-only canvas are not its stand-ins, so the pointer FAIL stays: a header's Menu button over a
     hero (its drawer opens over the canvas), a game's Sound toggle (its look changes when pressed), a Music toggle
     over a canvas that animates by itself. Stand-ins are: a transparent button whose Enter changes the canvas (next to
     a Sound toggle, which is tried after it), and a transparent button over a canvas that animates by itself. -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controls over canvases</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #fff; color: #111; }
  .hero { position: relative; height: 420px; }
  .hero canvas { display: block; width: 100%; height: 420px; }
  header { position: absolute; top: 0; left: 0; right: 0; display: flex; gap: 16px; align-items: center; padding: 16px 24px; color: #fff; }
  header a { color: #fff; }
  #menu { margin-left: auto; }
  #drawer { position: absolute; top: 64px; right: 24px; width: 220px; height: 160px; background: #fff; border: 1px solid #111; padding: 12px; }
  main { padding: 16px 24px; }
  .stage { position: relative; width: 480px; height: 300px; margin: 0 0 24px; }
  .stage canvas { display: block; }
  button.hud { position: absolute; top: 10px; right: 10px; padding: 8px 14px; font: inherit; background: #fff; color: #111; border: 2px solid #111; border-radius: 6px; }
  #menu { padding: 8px 14px; font: inherit; background: #fff; color: #111; border: 2px solid #111; border-radius: 6px; }
  button.hud[aria-pressed="true"] { background: #111; color: #fff; }
  button.proxy { position: absolute; margin: 0; padding: 0; border: 0; background: transparent; color: transparent; font-size: 1px; border-radius: 50%; }
  :focus-visible { outline: 3px solid #0050c0; outline-offset: 2px; }
</style>
</head>
<body>
<div class="hero">
  <header><a href="#">Studio</a><a href="#games">Games</a><button type="button" id="menu" aria-expanded="false" aria-controls="drawer">Menu</button></header>
  <div id="drawer" hidden><a href="#contact">Contact</a></div>
  <canvas id="hero"></canvas>
</div>
<main>
  <h1 id="games">Games</h1>

  <h2>Dots</h2>
  <p>Click the board to place a dot.</p>
  <div class="stage"><canvas id="dots" width="480" height="300"></canvas><button type="button" class="hud" aria-pressed="false">Sound</button></div>

  <h2>Stars</h2>
  <p>Click the sky to add a star.</p>
  <div class="stage"><canvas id="stars" width="480" height="300"></canvas><button type="button" class="hud" aria-pressed="false">Music</button></div>

  <h2>Lamp</h2>
  <div class="stage"><canvas id="lamp" width="480" height="300"></canvas><button type="button" class="hud" aria-pressed="false">Sound</button><button type="button" class="proxy" id="lamp-proxy" style="left: 190px; top: 100px; width: 100px; height: 100px;">Lamp, off</button></div>
  <p role="status" id="lamp-status"></p>

  <h2>Wheel</h2>
  <div class="stage"><canvas id="wheel" width="480" height="300"></canvas><button type="button" class="proxy" id="wheel-proxy" style="left: 200px; top: 110px; width: 80px; height: 80px;">Next slice</button></div>
  <p role="status" id="wheel-status"></p>
  <p id="contact">Contact: hello@example.com</p>
</main>
<script>
  // Hero: a click turns its hue. The Menu button opens a drawer over it.
  const hero = document.getElementById('hero'), hx = hero.getContext('2d');
  hero.width = hero.clientWidth; hero.height = 420; let hue = 200;
  const drawHero = () => { hx.fillStyle = `hsl(${hue} 60% 30%)`; hx.fillRect(0, 0, hero.width, hero.height); };
  drawHero();
  hero.addEventListener('pointerdown', () => { hue = (hue + 40) % 360; drawHero(); });
  const menu = document.getElementById('menu'), drawer = document.getElementById('drawer');
  menu.addEventListener('click', () => { const open = menu.getAttribute('aria-expanded') !== 'true'; menu.setAttribute('aria-expanded', String(open)); drawer.hidden = !open; });
  // Every Sound or Music toggle: pressed or not, and its look changes with it.
  for (const b of document.querySelectorAll('button.hud')) b.addEventListener('click', () => b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true')));

  // Dots: mouse only.
  const dots = document.getElementById('dots'), dx = dots.getContext('2d');
  dx.fillStyle = '#eef'; dx.fillRect(0, 0, 480, 300);
  dots.addEventListener('pointerdown', (e) => { const r = dots.getBoundingClientRect(); dx.fillStyle = '#c00'; dx.beginPath(); dx.arc(e.clientX - r.left, e.clientY - r.top, 10, 0, 7); dx.fill(); });

  // Stars: moves by itself, mouse only.
  const stars = document.getElementById('stars'), sx = stars.getContext('2d');
  const sky = Array.from({ length: 40 }, (_, i) => ({ x: (i * 97) % 480, y: (i * 53) % 300 }));
  (function tick() { sx.fillStyle = '#012'; sx.fillRect(0, 0, 480, 300); sx.fillStyle = '#fff'; for (const s of sky) { s.x = (s.x + 0.6) % 480; sx.fillRect(s.x, s.y, 2, 2); } requestAnimationFrame(tick); })();
  stars.addEventListener('pointerdown', (e) => { const r = stars.getBoundingClientRect(); sky.push({ x: e.clientX - r.left, y: e.clientY - r.top }); });

  // Lamp: a click or Enter on its stand-in turns it on or off, and the status line says so.
  const lamp = document.getElementById('lamp'), lx = lamp.getContext('2d'), lp = document.getElementById('lamp-proxy');
  let on = false;
  const drawLamp = () => { lx.fillStyle = '#223'; lx.fillRect(0, 0, 480, 300); lx.fillStyle = on ? '#fd4' : '#667'; lx.beginPath(); lx.arc(240, 150, 44, 0, 7); lx.fill(); };
  const toggleLamp = () => { on = !on; drawLamp(); lp.textContent = `Lamp, ${on ? 'on' : 'off'}`; document.getElementById('lamp-status').textContent = `The lamp is ${on ? 'on' : 'off'}.`; };
  drawLamp();
  lamp.addEventListener('pointerdown', toggleLamp); lp.addEventListener('click', toggleLamp);

  // Wheel: turns by itself; a click or Enter on its stand-in selects the next slice, and the status line says so.
  const wheel = document.getElementById('wheel'), wx = wheel.getContext('2d');
  const cols = ['#e76f51', '#f4a261', '#2a9d8f', '#264653', '#e9c46a', '#8ab17d'];
  let a = 0, sel = 0;
  const drawWheel = () => { wx.fillStyle = '#fbf7f0'; wx.fillRect(0, 0, 480, 300); for (let i = 0; i < 6; i++) { wx.beginPath(); wx.moveTo(240, 150); wx.arc(240, 150, 130, a + i * Math.PI / 3, a + (i + 1) * Math.PI / 3); wx.closePath(); wx.fillStyle = cols[i]; wx.globalAlpha = i === sel ? 1 : 0.45; wx.fill(); } wx.globalAlpha = 1; };
  (function spin() { a += 0.01; drawWheel(); requestAnimationFrame(spin); })();
  const next = () => { sel = (sel + 1) % 6; document.getElementById('wheel-status').textContent = `Slice ${sel + 1} of 6 selected.`; };
  wheel.addEventListener('pointerdown', next); document.getElementById('wheel-proxy').addEventListener('click', next);
</script>
</body>
</html>
