<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>tier.js and governor.js fixture</title>
<!-- templates/code/tier.js and governor.js on a page, for tools/regress.mjs. On load the page times its own work unit at
     CPU 1× (so the work is the same share of a frame on any host), measures the refresh while nothing runs, then waits.
     window.__g.start(ms): a continuous loop whose per-frame work is `ms` at 1×, divided by 4 at each governor level.
     window.__g.detect(ms): detectTier({ needsWebGL: false, work }) with a probe of `ms` at 1×.
     ?block=MS: the page's own animation loop busy-waits MS in every frame (a scene rendering at 1000/MS fps). -->
<style>body { margin: 0; font: 16px system-ui, sans-serif; } canvas { display: block; width: 100%; height: 50vh; background: #09122a; }</style>
</head><body>
<canvas id="c" aria-hidden="true"></canvas>
<p id="out">waiting</p>
<script type="module">
import { createGovernor } from '../../../skills/website-redesign/templates/code/governor.js';
import { measureRefresh, detectTier } from '../../../skills/website-redesign/templates/code/tier.js';
const q = new URLSearchParams(location.search);
const G = window.__g = { ready: false, frames: 0, level: 0, log: [], floor: null, changes: [] };
// A fixed amount of arithmetic per call; `perMs` calls take about 1 ms at CPU 1× on this host.
let sink = 0;
const unit = () => { let x = 0; for (let i = 0; i < 10000; i++) x += Math.sqrt(i * 1.0001) * Math.sin(i); sink += x; };
function calibrate() { let n = 0; const t0 = performance.now(); while (performance.now() - t0 < 200) { unit(); n++; } return n / (performance.now() - t0); }
const block = Number(q.get('block') || 0);
const ctx = document.getElementById('c').getContext('2d');
G.perMs = calibrate();
G.refreshMs = await measureRefresh();
if (block) { const slow = () => { const until = performance.now() + block; while (performance.now() < until); requestAnimationFrame(slow); }; requestAnimationFrame(slow); }
G.start = (ms) => {
  const gov = createGovernor({ levels: 4, refreshMs: G.refreshMs || 0, onChange: (level, why, stats) => { G.level = level; G.changes.push({ t: Math.round(performance.now() - G.t0), level, p50: stats && Math.round(stats.p50) }); }, onFloor: (why) => { G.floor = Math.round(performance.now() - G.t0); } });
  G.gov = gov; G.t0 = performance.now();
  const loop = (now) => {
    const calls = Math.round((ms * G.perMs) / 4 ** gov.level);
    for (let i = 0; i < calls; i++) unit();
    ctx.fillStyle = `hsl(${(now / 20) % 360} 50% 40%)`; ctx.fillRect(0, 0, 40, 40);
    G.frames++;
    gov.frame(now);
    if (G.floor == null) requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
};
G.detect = async (ms) => { const calls = Math.round(ms * G.perMs); return detectTier({ needsWebGL: false, work: () => { for (let i = 0; i < calls; i++) unit(); } }); };
G.ready = true;
document.getElementById('out').textContent = `ready: ${G.perMs.toFixed(1)} units/ms, refresh ${G.refreshMs}`;
</script>
</body></html>
