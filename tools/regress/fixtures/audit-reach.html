<!doctype html>
<!--
  Regression fixture for audit.mjs (tools/regress.mjs, group "audit"), run at 1024: no page-level clip. The nowrap
  line runs out of its own 200px box, at the end (right) side, past the right edge of the viewport; the page scrolls
  sideways to it, so expect "✗ Horizontal overflow" naming div.box (the text that widened the page; no element box
  did) and no "Text past the viewport" naming div.box. The list item's negative text-indent pulls its first line past
  the left (start) edge, where nothing scrolls: expect "✗ Text past the viewport, where no scroll reaches it" naming
  ul.hang > li, "past the left edge", and never "the page clips itself" (it does not).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening hours</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  header, footer { padding: 12px 16px; }
  main { padding: 8px 16px; }
  .box { width: 200px; margin-inline-start: auto; white-space: nowrap; border: 1px solid #555; }
  .hang { list-style: none; margin: 0; padding: 0; }
  .hang li { text-indent: -40px; }
</style>
</head>
<body>
<header>Harbour shop</header>
<main>
  <h1>Opening hours</h1>
  <div class="box">Opening hours this week: Monday to Saturday from nine until six, Sunday closed</div>
  <ul class="hang"><li>— Orders placed before noon leave the same day, and the rest leave the next morning.</li></ul>
</main>
<footer>Harbour shop, Quay Street</footer>
</body>
</html>
