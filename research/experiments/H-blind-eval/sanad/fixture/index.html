<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanad</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="topbar">
  <div class="brand">✦ Sanad</div>
  <div class="actions">
    <a href="#" id="lang-toggle" class="lang">English</a>
    <button class="icon" id="bell" title="notifications">🔔</button>
    <div class="avatar">AM</div>
  </div>
</div>
<div class="layout">
  <div class="sidebar">
    <div class="nav-item active" data-i18n="dashboard">لوحة التحكم</div>
    <div class="nav-item" data-i18n="invoices">الفواتير</div>
    <div class="nav-item" data-i18n="clients">العملاء</div>
    <div class="nav-item" data-i18n="reports">التقارير</div>
    <div class="nav-item" data-i18n="settings">الإعدادات</div>
  </div>
  <div class="content">
    <h1 id="hello">مرحباً أحمد 👋</h1>
    <div class="kpis" id="kpis"></div>
    <div class="grid2">
      <div class="card">
        <div class="card-title" data-i18n="revenue">الإيرادات الشهرية</div>
        <svg id="chart" width="100%" height="220"></svg>
      </div>
      <div class="card">
        <div class="card-title" data-i18n="overdue">فواتير متأخرة</div>
        <div id="overdue-list"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><div class="card-title" data-i18n="recent">أحدث الفواتير</div><input id="filter" placeholder="بحث..."><button id="new-invoice" class="btn">+ فاتورة جديدة</button></div>
      <table id="invoices"><thead><tr>
        <th data-i18n="number">رقم الفاتورة</th><th data-i18n="client">العميل</th><th data-i18n="issued">تاريخ الإصدار</th><th data-i18n="due">تاريخ الاستحقاق</th><th data-i18n="net">المبلغ</th><th data-i18n="vat">الضريبة</th><th data-i18n="total">الإجمالي</th><th data-i18n="status">الحالة</th>
      </tr></thead><tbody id="rows"></tbody></table>
    </div>
  </div>
</div>
<div id="modal" class="modal" style="display:none"><div class="modal-box"><div class="close" onclick="document.getElementById('modal').style.display='none'">×</div>
  <h3 data-i18n="new">فاتورة جديدة</h3>
  <input id="f-client" placeholder="اسم العميل"><input id="f-amount" type="number" placeholder="المبلغ"><div class="btn" id="f-save">حفظ</div><div id="f-msg"></div>
</div></div>
<script src="assets/app.js"></script>
</body>
</html>
