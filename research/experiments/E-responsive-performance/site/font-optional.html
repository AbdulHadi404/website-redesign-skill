<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>font-optional</title>
<style>
@font-face { font-family: "Playfair Display"; font-weight: 700; font-display: optional; src: url(fonts/playfair-700-latin.woff2) format("woff2"); }

body { margin: 0; padding: 16px; font: 16px/1.5 system-ui, sans-serif; }
h1 { font-family: "Playfair Display", serif; font-weight: 700; font-size: 44px; line-height: 1.1; margin: 0 0 16px; }
.block { height: 300px; background: #eee; margin-top: 16px; }
</style></head><body>
<h1>Groceries delivered in an hour, anywhere in town, every day of the week</h1>
<p>Order in two taps and track the rider to your door. Fresh food, fair prices, no minimum basket.</p>
<div class="block"></div><p style="height:900px">More</p>
</body></html>
