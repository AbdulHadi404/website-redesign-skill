<!doctype html><html lang="en"><head><meta charset="utf-8"><title>probe</title>
<style>.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.vh2{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}</style></head><body><main>
<form role="search"><label class="vh" for="a">Search A (clip-path)</label><input id="a" type="search"></form>
<form role="search"><label class="vh2" for="b">Search B (clip rect)</label><input id="b" type="search"></form>
<form role="search"><label for="c">Search C (visible)</label><input id="c" type="search"></form>
<form><label class="vh" for="d">Search D no role</label><input id="d" type="search"></form>
</main></body></html>
