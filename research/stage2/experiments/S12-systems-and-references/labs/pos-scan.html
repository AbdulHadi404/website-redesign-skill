<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Wedge scanner lab</title></head>
<body>
<label>Search products <input id="search" autocomplete="off"></label>
<ol id="order"></ol>
<script>
// Burst-gate detector: a keyboard-wedge scanner types a whole code in a burst (a few ms per key)
// ending in Enter/Tab; people type 60–200 ms per key. The second fast key switches to scan mode:
// later keys are swallowed, the first (already typed) key is taken back out of the focused field,
// and the code is routed to the order, never to whatever field had focus.
window.scans = []; window.rejected = [];
const MAX_GAP = Number(new URLSearchParams(location.search).get('gap') || 35); // ms between scanner keys
const MIN_LEN = 6;
let buf = '', last = 0, scanning = false, target = null;
function reset() { buf = ''; scanning = false; target = null; }
document.addEventListener('keydown', (e) => {
  const now = performance.now();
  const gap = now - last; last = now;
  if (e.key === 'Enter' || e.key === 'Tab') {
    if (scanning && buf.length >= MIN_LEN) {
      e.preventDefault();
      if (target && 'value' in target && target.value.endsWith(buf[0])) target.value = target.value.slice(0, -1);
      window.scans.push(buf);
      const li = document.createElement('li'); li.textContent = buf; document.getElementById('order').append(li);
    } else if (buf.length) window.rejected.push(buf);
    reset(); return;
  }
  if (e.key.length !== 1) return;
  if (buf && gap > MAX_GAP) {                  // too slow: a person typing — give back any swallowed keys
    if (scanning && target && 'value' in target) target.value += buf.slice(1);
    reset();
  }
  if (buf && gap <= MAX_GAP) { scanning = true; }
  if (!buf) target = document.activeElement;
  buf += e.key;
  if (scanning) e.preventDefault();            // keep the rest of the code out of the field
}, true);
</script>
</body>
</html>
