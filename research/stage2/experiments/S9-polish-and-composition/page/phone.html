<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>staff view (source of img/phone.png)</title>
<style>
  @font-face { font-family: 'GSF Static'; src: url(/assets/gsf-wght.woff2) format('woff2'); font-weight: 100 1000; }
  html, body { margin: 0; background: #fff; }
  body { width: 300px; height: 560px; font: 14px/1.45 'GSF Static', sans-serif; color: #222; overflow: hidden; }
  .top { padding: 44px 18px 12px; }
  .top p { margin: 0; color: #666; font-size: 13px; }
  .top h1 { margin: 2px 0 0; font-size: 22px; line-height: 1.2; }
  .shift { margin: 10px 14px; padding: 12px 14px; border-radius: 12px; background: #f6f6f6; }
  .shift b { display: block; font-size: 15px; }
  .shift span { color: #666; font-size: 13px; }
  .shift.next { background: #fbe8e2; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; border-top: 1px solid #eee; display: flex; justify-content: space-around; align-items: center; color: #666; font-size: 12px; }
</style>
</head>
<body>
  <div class="top"><p>Hi Mei, your next shifts</p><h1>This week</h1></div>
  <div class="shift next"><b>Thursday, 16:00–23:00</b><span>Late, pastry section, with Ana and Tom</span></div>
  <div class="shift"><b>Friday, 16:00–23:00</b><span>Late, pastry section</span></div>
  <div class="shift"><b>Saturday, 10:00–16:00</b><span>Brunch, with Sam</span></div>
  <div class="shift"><b>Monday, off</b><span>Holiday approved</span></div>
  <div class="bar"><span>Shifts</span><span>Swaps</span><span>Hours</span></div>
</body>
</html>
