<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Animated canvas with a keyboard path</title>
<!-- A canvas that animates by itself (a slowly turning wheel) with a stand-in button and a status line; the
     wheel stops under reduced motion. Without reduced motion pixel change is no evidence, so the probe must
     rely on narration. Expected: PASS in both modes. -->
<style>body{margin:0;padding:20px;font:16px system-ui}.wrap{position:relative;width:420px}canvas{display:block}
#b{position:absolute;left:170px;top:130px;width:80px;height:80px;border-radius:50%;background:transparent;border:0;color:transparent}#b:focus-visible{outline:3px solid #1f5fd1}</style></head>
<body><main><h1>Pick a slice</h1><div class="wrap"><canvas id="c" width="420" height="340" aria-hidden="true"></canvas><button id="b" type="button">Next slice</button></div><p role="status" id="s"></p></main>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let a=0,sel=0;const still=matchMedia('(prefers-reduced-motion: reduce)').matches;const cols=['#e76f51','#f4a261','#2a9d8f','#264653','#e9c46a','#8ab17d'];
function draw(){x.fillStyle='#fbf7f0';x.fillRect(0,0,420,340);for(let i=0;i<6;i++){x.beginPath();x.moveTo(210,170);x.arc(210,170,140,a+i*Math.PI/3,a+(i+1)*Math.PI/3);x.closePath();x.fillStyle=cols[i];x.globalAlpha=i===sel?1:.45;x.fill();}x.globalAlpha=1;}
(function f(){if(!still)a+=0.01;draw();if(!still)requestAnimationFrame(f)})();
function next(){sel=(sel+1)%6;draw();document.getElementById('s').textContent='Slice '+(sel+1)+' of 6 selected.';}
c.addEventListener('pointerdown',next);document.getElementById('b').addEventListener('click',next);
</script></body></html>
