<!doctype html><html lang="en"><head><meta charset="utf-8"><title>WebGL toy with a keyboard path</title>
<!-- Keyboard-operable WebGL canvas: a button over the object, a status line. Default context
     (preserveDrawingBuffer: false), the way three.js and Pixi create it. Expected: PASS. -->
<style>body{margin:0;padding:20px;font:16px system-ui}.wrap{position:relative;width:480px}canvas{display:block}
#p{position:absolute;left:200px;top:140px;width:80px;height:80px;background:transparent;border:0;color:transparent}#p:focus-visible{outline:3px solid #1f5fd1}</style></head>
<body><main><h1>Colour the box</h1><div class="wrap"><canvas id="c" width="480" height="360" aria-hidden="true"></canvas>
<button id="p" type="button">Box, red. Press Enter to change colour</button></div><p role="status" id="s"></p></main>
<script>
const PRESERVE = new URLSearchParams(location.search).has('preserve');
const c=document.getElementById('c'),gl=c.getContext('webgl',{preserveDrawingBuffer:PRESERVE});const cols=[[.8,.1,.1],[.1,.6,.2],[.1,.3,.8]],names=['red','green','blue'];let i=0;
function draw(){gl.clearColor(...cols[i],1);gl.clear(gl.COLOR_BUFFER_BIT);}
function next(){i=(i+1)%3;draw();const b=document.getElementById('p');b.textContent='Box, '+names[i]+'. Press Enter to change colour';document.getElementById('s').textContent='Box is now '+names[i]+'.';}
c.addEventListener('pointerdown',next);document.getElementById('p').addEventListener('click',next);draw();
</script></body></html>
