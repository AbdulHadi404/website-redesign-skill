<!doctype html><html lang="en"><head><meta charset="utf-8"><title>WebGL toy, mouse only</title>
<!-- The same WebGL toy with no keyboard path: the only way to change it is a click on the canvas. Expected: FAIL. -->
<style>body{margin:0;padding:20px;font:16px system-ui}canvas{display:block}</style></head>
<body><main><h1>Colour the box</h1><canvas id="c" width="480" height="360"></canvas><p><a href="#more">More about boxes</a></p><p role="status" id="s"></p></main>
<script>
const c=document.getElementById('c'),gl=c.getContext('webgl');const cols=[[.8,.1,.1],[.1,.6,.2],[.1,.3,.8]];let i=0;
function draw(){gl.clearColor(...cols[i],1);gl.clear(gl.COLOR_BUFFER_BIT);}
c.addEventListener('pointerdown',()=>{i=(i+1)%3;draw();});draw();
</script></body></html>
