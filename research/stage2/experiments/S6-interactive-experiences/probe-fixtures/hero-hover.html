<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Hero that follows the pointer</title>
<!-- A decorative hero: follows pointer movement only, aria-hidden, stops under reduced motion.
     Expected: PASS (hover-reactive noted as INFO). -->
<style>body{margin:0;font:16px system-ui}.hero{position:relative;height:500px}canvas{position:absolute;inset:0;width:100%;height:100%}
.copy{position:absolute;left:40px;top:160px}.copy a{display:inline-block;padding:12px 20px;background:#222;color:#fff}</style></head>
<body><div class="hero"><canvas id="c" aria-hidden="true"></canvas><div class="copy"><h1>We make things</h1><a href="other.html">See our work</a></div></div>
<script>
const c=document.getElementById('c');c.width=c.clientWidth;c.height=c.clientHeight;const x=c.getContext('2d');let px=400,py=250,t=0;
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
c.parentElement.addEventListener('pointermove',(e)=>{px=e.clientX;py=e.clientY;if(still)draw()});
function draw(){x.fillStyle='#e8eef8';x.fillRect(0,0,c.width,c.height);x.fillStyle='#3a6fd8';x.beginPath();x.arc(px+Math.sin(t)*40,py,60,0,7);x.fill();}
(function f(){t+=0.03;draw();if(!still)requestAnimationFrame(f)})();
</script></body></html>
